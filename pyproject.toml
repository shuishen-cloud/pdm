[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "project-develop-manager"
version = "0.1.0"
description = "跟踪项目开发中的问题、难点与易错点：提交笔记、问题流程与文档版本"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]
tui = ["textual>=0.80"]

[project.scripts]
pdm = "pdev.cli:entry"

[tool.setuptools.packages.find]
include = ["pdev*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
